name : Run Tests

on:
    push:
        branches:
            - main
        paths:
            - 'services/**'
            - .github/workflows/test.yaml
    pull_request:
    workflow_dispatch:

jobs:
    filter:
        runs-on: ubuntu-24.04
        outputs:
            services: ${{ steps.filter.outputs.changes }}
        steps:
            - name: Checkout code
              uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 #v5.0.0

            - name: filter
              id: filter
              uses: dorny/paths-filter@v4.0.3 # v4 (runtime: Node.js 24)
              with:
                token: ${{ secrets.GITHUB_TOKEN }}
                filters: .github/utils/file-filters.yaml
    test:
        runs-on: ubuntu-24.04
        needs: filter
        strategy:
          fail-fast: false
          matrix:
            service: ${{ fromJSON(needs.filter.outputs.services) }}
        steps:
            - name: Checkout code
              uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 #v5.0.0

            - name: Set up Node.js
              if: ${{ startsWith(matrix.service, 'services/node') || startsWith(matrix.service, 'services/react') }}
              uses: actions/setup-node@d7a11313b581b306c961b506cfc8971208bb03f6 #4.4.0
              with:
                node-version-file: ${{ matrix.service }}/package.json
                cache: "npm"
                cache-dependency-path: ${{ matrix.service }}/package-lock.json

            - name: Set up go
              if: ${{ startsWith(matrix.service, 'services/go') }}
              uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 #5.5.0
              with:
                go-version-file: services/go/api-golang/go.mod
                cache-dependency-path: services/go/api-golang/go.sum
            
            - name: Set up Poetry
              if: ${{ startsWith(matrix.service, 'services/python') }}
              uses: snok/install-poetry@76e04a911780d5b312d89783f7b1cd627778900a
             
            - name: Set up Python
              if: ${{ startsWith(matrix.service, 'services/python') }}
              uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 #v5.6.0
              with:
                python-version-file: ${{ matrix.service }}/pyproject.toml
                cache: poetry
                cache-dependency-path: ${{ matrix.service }}/poetry.lock

            - name: Set up Task
              uses: supplypike/setup-bin@1fafb085795af4a3f183502f3a9dffa8f7b83217 #5.0.0
              with:
                uri: https://github.com/go-task/task/releases/download/v3.44.1/task_linux_amd64.tar.gz #v3.44.1
                name: task
                version: 3.44.1

            - name : Install app dependencies
              working-directory: ${{ matrix.service }}
              run: |
                task install-ci

            - name : Run Tests
              working-directory: ${{ matrix.service }}
              run: |
                task test
            
