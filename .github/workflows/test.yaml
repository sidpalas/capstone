name: Run Tests

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #v7.0.0
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        #TODO: use specific version + setup caching

      - name: Install task #to call on specific test tasks in taskfile under service > lang
        uses: supplypike/setup-bin@8365380a806a88e7a0f0d07059b175ca2f5418d7
        with:
          uri: https://github.com/go-task/task/releases/download/v3.52.0/task_linux_amd64.tar.gz
          name: task
          version: v3.52.0

      - name: Install Node Deps
        working-directory: services/node/api-node
        run: |
          task install-ci

      - name: Run tests
        working-directory: services/node/api-node
        run: |
          task test
