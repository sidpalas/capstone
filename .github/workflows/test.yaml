name: Run Tests

on:
  workflow_dispatch:

jobs:
  filter:
    runs-on: ubuntu-24.04
    outputs:
      services: ${{ steps.filter.outputs.changes }} # changes output comes from 3rd party action paths-filter
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 #v4.3.1
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - name: filter
        id: filter # need ID passes output to downstream job
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        # outputs changes: JSON array w names of all filters matching any of the changed files
        with:
          working-directory: ${{ github.workspace }}
          token: ${{ secrets.GITHUB_TOKEN }} # github.token also acceptable
          filters: .github/utils/file-filters.yaml
          base: "main"

  test:
    runs-on: ubuntu-24.04
    needs: filter
    strategy: # use matrix to run tests of different services
      fail-fast: false #don't stop matrix if one run (i.e. one service) fails
      matrix:
        service:
          [
            "services/go/api-golang",
            "services/node/api-node",
            "services/python/load-generator-python",
            "services/react/client-react",
          ]
    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #v7.0.0

      - name: Setup Go
        if: ${{ matrix.service == 'services/go/api-golang'}}
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: ${{ matrix.service }}/go.mod
          #cache enabled by default
          cache-dependency-path: ${{ matrix.service }}/go.sum

      - name: Setup Node
        if: ${{ startsWith(matrix.service, 'services/node/' || 'services/react/') }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ${{ matrix.service }}/package.json
          cache: "npm"
          cache-dependency-path: ${{ matrix.service }}/package-lock.json #for cache key

      - name: Install Poetry
        if: ${{ startsWith(matrix.service, 'services/python')}}
        uses: snok/install-poetry@76e04a911780d5b312d89783f7b1cd627778900a # v1.4.1

      - name: Setup Python
        if: ${{ startsWith(matrix.service, 'services/python')}}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: ${{ matrix.service }}/pyproject.toml
          cache: poetry
          cache-dependency-path: ${{ matrix.service }}/poetry.lock

      - name: Install task #to call on specific test tasks in taskfile under service > lang
        uses: supplypike/setup-bin@8e3f88b4f143d9b5c3497f0fc12d45c83c123787 # v4.0.1
        with:
          uri: https://github.com/go-task/task/releases/download/v3.52.0/task_linux_amd64.tar.gz
          name: task
          version: v3.52.0

      - name: Install app deps
        working-directory: ${{ matrix.service }}
        run: |
          task install-ci

      - name: Run tests
        working-directory: ${{ matrix.service }}
        run: |
          task test
