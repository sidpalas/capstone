version: "3"

env:
  GITHUB_TOKEN: 
    sh : gh auth token

tasks:
  trigger-workflow:
    desc: Trigger GitHub workflow using act
    cmds:
      - |
        act workflow_dispatch \
          --container-architecture linux/amd64 \
          -s GITHUB_TOKEN \
          -e {{.PWD}}/event.json \
          -P ubuntu-24.04=catthehacker/ubuntu:act-22.04 \
          --directory ../../.. \
          -W .github/workflows/build-push.yaml

  trigger-workflow-tag:
    desc: Trigger GitHub workflow using act
    cmds:
      - |
        act push \
          --container-architecture linux/amd64 \
          -s GITHUB_TOKEN \
          -e {{.PWD}}/push-tag-event.json \
          -P ubuntu-24.04=catthehacker/ubuntu:act-22.04 \
          --directory ../../.. \
          --no-skip-checkout \
          -W .github/workflows/build-push.yaml

  trigger-workflow-workflow-dispatch:
    desc: Trigger GitHub workflow using act
    cmds:
      - |
        act workflow_dispatch \
          --container-architecture linux/amd64 \
          -s GITHUB_TOKEN \
          -e {{.PWD}}/workflow_dispatch-event.json \
          -P ubuntu-24.04=catthehacker/ubuntu:act-22.04 \
          --directory ../../.. \
          --no-skip-checkout \
          -W .github/workflows/build-push.yaml